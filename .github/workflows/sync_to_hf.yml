name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ tab Actions trên GitHub
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure Git LFS and migrate large files to LFS to bypass Hugging Face's 10MB limit
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git lfs install
          # Checkout main branch to ensure we're not in detached HEAD state
          git checkout main || git checkout -b main
          git lfs migrate import --everything --include="*.pth" --yes
          git push --force https://user:$HF_TOKEN@huggingface.co/spaces/tinytqa/FER-Web-App main
